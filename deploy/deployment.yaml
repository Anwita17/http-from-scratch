apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpserver
  labels:
    app: myhttpserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myhttpserver
  template:
    metadata:
      labels:
        app: myhttpserver
    spec:
      containers:
      - name: httpserver
        image: httpserver:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
          - name: OTEL_SERVICE_NAME
            value: httpserver
          - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://vt-vt-single-server.monitoring.svc:10428/insert/opentelemetry/v1/traces